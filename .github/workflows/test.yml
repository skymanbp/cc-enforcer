name: tests

# Runs the stdlib unittest suite (tests/README.md) on pushes to main, PRs
# into main and manual dispatch, on both Linux and Windows (the plugin
# specifically handles Windows path and encoding quirks, so cross-platform
# coverage matters). CI pins one Python; the supported floor is 3.11
# (README).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger from the Actions tab — useful for re-running after a
  # transient failure or for ad-hoc verification of an unmerged branch.
  workflow_dispatch:

# Cancel an in-progress run when a newer commit lands on the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history + tags. tests/test_version_sync.py compares every
          # released CHANGELOG heading against `git tag`, and the default
          # depth-1 checkout brings no tags at all — the gate would have
          # nothing to read.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show Python version
        run: python --version

      - name: Run unit tests
        run: python -m unittest discover tests -v
